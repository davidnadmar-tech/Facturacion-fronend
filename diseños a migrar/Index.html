<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Sistema</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Menú lateral */
    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: white;
      padding-top: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu-item {
      padding: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .menu-item:hover {
      background: #34495e;
    }

    .submenu {
      display: none;
      padding-left: 20px;
      background: #34495e;
    }

    .submenu .menu-item {
      font-size: 14px;
    }

    /* Contenido */
    .content {
      flex: 1;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Menú lateral -->
  <div class="sidebar">
    <h2>Menú</h2>
    <div class="menu-item" onclick="toggleSubmenu('facturacion')">📄 Facturación</div>
    <div class="submenu" id="submenu-facturacion">
      <div class="menu-item" onclick="loadPage('nueva.html')">➕ Nueva Factura</div>
      <div class="menu-item" onclick="loadPage('facturaRapida.html')">⚡ Factura Rápida</div>
      <div class="menu-item" onclick="loadPage('consultafacturas.html')">📊 Consulta de Facturas</div>
    </div>

    <div class="menu-item" onclick="loadPage('MtoClientes.html')">👥 Mantenimiento de Clientes</div>
    <div class="menu-item" onclick="loadPage('MtoProductos.html')">📦 Mantenimiento de Inventario</div>
  </div>

  <!-- Contenido dinámico -->
  <div class="content">
    <iframe id="mainFrame" src=""></iframe>
  </div>
  
  <script>

   let CLIENTES = JSON.parse(localStorage.getItem("CLIENTES")) || [
    {codigo:"C001", nombre:"Carlos Pérez"},
    {codigo:"C002", nombre:"Ana Gómez"}
];

    // Función para agregar cliente y actualizar almacenamiento
    function agregarCliente(codigo, nombre) {
        CLIENTES.push({codigo, nombre});
        localStorage.setItem("CLIENTES", JSON.stringify(CLIENTES));
    }
    

    function toggleSubmenu(menu) {
      const submenu = document.getElementById("submenu-" + menu);
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }

    // Cargar página dentro del iframe
    function loadPage(page) {
      document.getElementById("mainFrame").src = page;
    }
  </script>
</body>
</html>
