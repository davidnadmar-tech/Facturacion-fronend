<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mantenimiento de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body{
      padding:20px;
      background:linear-gradient(135deg,#f0f4ff,#e0f7fa);
      font-family: 'Segoe UI', sans-serif;
    }
    h2{
      font-weight:700;
      color:#0d47a1;
      text-shadow:1px 1px 2px rgba(0,0,0,.1);
    }
    .btn-primary{
      background:linear-gradient(135deg,#1976d2,#0d47a1);
      border:none;
    }
    .btn-primary:hover{
      background:linear-gradient(135deg,#1565c0,#0b3c91);
    }
    .card{
      border-radius:1rem;
      box-shadow:0 4px 10px rgba(0,0,0,.1);
    }
    .card-body{
      padding:2rem;
    }
    .table{
      border-radius:10px;
      overflow:hidden;
    }
    .table thead{
      background:#0d47a1;
      color:white;
    }
    .table tbody tr:hover{
      background:#e3f2fd;
    }
    .input-group .btn{
      border-radius:0 .5rem .5rem 0;
    }
    #formCard{
      animation: fadeInDown .5s ease;
    }
    @keyframes fadeInDown{
      from{opacity:0;transform:translateY(-20px);}
      to{opacity:1;transform:translateY(0);}
    }
    .modal-content{
      border-radius:1rem;
    }
    .cursor-pointer:hover{
      background:#bbdefb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4"><i class="fa-solid fa-users"></i> Mantenimiento de Clientes</h2>

    <div class="mb-3 d-flex flex-wrap gap-2">
      <button id="btnNuevo" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Agregar nuevo cliente</button>

      <div class="input-group flex-grow-1">
        <input id="filtro" type="text" class="form-control" placeholder="🔍 Buscar por nombre o documento...">
        <button id="btnBuscar" class="btn btn-outline-primary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
      </div>
    </div>

    <!-- Formulario -->
    <div id="formCard" class="card mb-4" style="display:none">
      <div class="card-body">
        <h5 class="mb-3"><i class="fa-solid fa-id-card"></i> Datos del Cliente</h5>
        <form id="clienteForm">
          <div class="row g-3">
            <div class="col-md-2">
              <label class="form-label">Código</label>
              <input id="codigo" class="form-control" readonly>
            </div>
            <div class="col-md-5">
              <label class="form-label">Nombre</label>
              <input id="nombre" class="form-control" required>
            </div>
            <div class="col-md-5">
              <label class="form-label">Teléfono</label>
              <input id="telefono" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label">Email / Correo</label>
              <input id="email" type="email" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label">Código Actividad</label>
              <div class="input-group">
                <input id="codigoActividad" class="form-control" readonly>
                <button id="btnBuscarActividad" type="button" class="btn btn-outline-secondary"><i class="fa-solid fa-search"></i></button>
              </div>
            </div>

            <div class="col-md-12">
              <label class="form-label">Descripción Actividad/Giro</label>
              <input id="descripcionActividad" class="form-control" readonly>
            </div>

            <div class="col-md-4">
              <label class="form-label">NRC</label>
              <input id="nrc" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">NIT</label>
              <input id="nit" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">DUI</label>
              <input id="dui" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label">Departamento</label>
              <select id="departamento" class="form-select"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Municipio</label>
              <select id="municipio" class="form-select"></select>
            </div>

            <div class="col-12 mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
              <button id="btnCancelar" type="button" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="card">
      <div class="card-body">
        <h5 class="mb-3"><i class="fa-solid fa-table"></i> Lista de Clientes</h5>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle" id="tablaClientes">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>NRC</th>
                <th>NIT</th>
                <th>DUI</th>
                <th>Email</th>
                <th>Descripción Actividad</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal Actividades -->
  <div class="modal fade" id="modalActividades" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-briefcase"></i> Buscar Actividad Económica</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <input id="buscarAct" type="text" class="form-control" placeholder="Buscar por código o descripción">
            <button id="btnBuscarActModal" class="btn btn-outline-primary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
          </div>
          <div style="max-height:320px; overflow:auto">
            <table class="table table-sm table-hover" id="tablaActividades">
              <thead class="table-light"><tr><th>Código</th><th>Descripción</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fa-solid fa-xmark"></i> Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Se mantiene el mismo script de lógica original -->
  <script>
      // --- Datos de ejemplo de actividades (puedes ampliar) ---
    const actividades = [
      {codigo:'A001', descripcion:'Comercio al por menor'},
      {codigo:'A002', descripcion:'Servicios de transporte'},
      {codigo:'A003', descripcion:'Restaurantes y bares'},
      {codigo:'A004', descripcion:'Construcción'},
      {codigo:'A005', descripcion:'Servicios profesionales'},
      {codigo:'A006', descripcion:'Agricultura y ganadería'},
      {codigo:'A007', descripcion:'Industria manufacturera'}
    ];

    // --- Departamentos y municipios (lista representativa, ampliar si desea) ---
    const municipiosPorDepartamento = {
      'Ahuachapán': ['Ahuachapán','Atiquizaya','Concepción de Ataco','El Refugio','Guaymango','Jujutla','San Francisco Menéndez','San Lorenzo','Turín'],
      'Cabañas': ['Sensuntepeque','Ilobasco','Tejutepeque','San Isidro'],
      'Chalatenango': ['Chalatenango','Dulce Nombre de María','Nueva Concepción','Arcatao','La Palma','Nombre de Jesús'],
      'Cuscatlán': ['Cojutepeque','Candelaria','Oratorio de Concepción','San Pedro Perulapán'],
      'La Libertad': ['Santa Tecla','Antiguo Cuscatlán','La Libertad','Colón','Jayaque','Zaragoza','Comasagua','Huizúcar'],
      'La Paz': ['Zacatecoluca','Olocuilta','San Pedro Masahuat','San Luis Talpa','Zacatecoluca'],
      'La Unión': ['La Unión','Pasaquina','Conchagua','Nueva Esparta'],
      'Morazán': ['San Francisco Gotera','Torola','Perquín','Meanguera'],
      'San Miguel': ['San Miguel','Chinameca','Chapeltique','Sesori','Quelepa'],
      'San Salvador': ['San Salvador','Soyapango','Apopa','San Marcos','Ilopango','Cuscatancingo','Mejicanos','Tonacatepeque'],
      'San Vicente': ['San Vicente','Apastepeque','Tecoluca','Verapaz'],
      'Santa Ana': ['Santa Ana','Metapán','Chalchuapa','El Congo'],
      'Sonsonate': ['Sonsonate','Acajutla','Izalco','Juayúa','Nahuizalco'],
      'Usulután': ['Usulután','Alegría','Puerto El Triunfo','Jiquilisco']
    };

    // --- Estado y almacenamiento local ---
    let clientes = JSON.parse(localStorage.getItem('clientes_v1')||'[]');
    let editIndex = -1; // índice del cliente que se está editando

    // Elementos DOM
    const btnNuevo = document.getElementById('btnNuevo');
    const formCard = document.getElementById('formCard');
    const clienteForm = document.getElementById('clienteForm');
    const btnCancelar = document.getElementById('btnCancelar');
    const tablaBody = document.querySelector('#tablaClientes tbody');
    const filtro = document.getElementById('filtro');
    const btnBuscar = document.getElementById('btnBuscar');

    // Campos
    const codigo = document.getElementById('codigo');
    const nombre = document.getElementById('nombre');
    const telefono = document.getElementById('telefono');
    const email = document.getElementById('email');
    const codigoActividad = document.getElementById('codigoActividad');
    const descripcionActividad = document.getElementById('descripcionActividad');
    const nrc = document.getElementById('nrc');
    const nit = document.getElementById('nit');
    const dui = document.getElementById('dui');
    const departamento = document.getElementById('departamento');
    const municipio = document.getElementById('municipio');

    // Modal bootstrap
    const modalActividadesEl = document.getElementById('modalActividades');
    const modalActividades = new bootstrap.Modal(modalActividadesEl);

    // Inicialización
    function init(){
      poblarDepartamentos();
      renderTabla(clientes);
    }

    function poblarDepartamentos(){
      departamento.innerHTML = '<option value="">-- Seleccione departamento --</option>';
      Object.keys(municipiosPorDepartamento).forEach(dep=>{
        const opt = document.createElement('option'); opt.value = dep; opt.textContent = dep; departamento.appendChild(opt);
      });
      departamento.addEventListener('change', ()=>{
        const dep = departamento.value;
        municipio.innerHTML = '';
        if(!dep){ municipio.innerHTML = '<option value="">-- Seleccione municipio --</option>'; return; }
        municipiosPorDepartamento[dep].forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; municipio.appendChild(o); });
      });
    }

    // Genera código automático incremental
    function generarCodigo(){
      // formato C0001, C0002, ...
      const last = clientes.length? clientes[clientes.length-1].codigo : null;
      if(!last) return 'C0001';
      const num = parseInt(last.replace(/\D/g,'')) + 1;
      return 'C' + String(num).padStart(4,'0');
    }

    // Render tabla
    function renderTabla(list){
      tablaBody.innerHTML = '';
      list.forEach((c, idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(c.nombre)}</td>
          <td>${escapeHtml(c.nrc||'')}</td>
          <td>${escapeHtml(c.nit||'')}</td>
          <td>${escapeHtml(c.dui||'')}</td>
          <td>${escapeHtml(c.email||'')}</td>
          <td>${escapeHtml(c.descripcionActividad||'')}</td>
          <td>
            <button data-idx="${idx}" class="btn btn-sm btn-primary btn-editar">Modificar</button>
          </td>`;
        tablaBody.appendChild(tr);
      });
      // attach editar handlers
      document.querySelectorAll('.btn-editar').forEach(btn=>btn.addEventListener('click', (e)=>{
        const i = parseInt(e.target.dataset.idx); abrirParaEditar(i);
      }));
    }

    // Seguridad básica para HTML
    function escapeHtml(text){ if(!text) return ''; return text.toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    // Abrir formulario para nuevo
    btnNuevo.addEventListener('click', ()=>{
      editIndex = -1;
      clienteForm.reset();
      codigo.value = generarCodigo();
      descripcionActividad.value = '';
      codigoActividad.value = '';
      formCard.style.display = 'block';
      window.scrollTo({top:0,behavior:'smooth'});
    });

    // Cancelar
    btnCancelar.addEventListener('click', ()=>{ formCard.style.display='none'; });

    // Guardar (agregar o actualizar)
    clienteForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const obj = {
        codigo: codigo.value || generarCodigo(),
        nombre: nombre.value.trim(),
        telefono: telefono.value.trim(),
        email: email.value.trim(),
        codigoActividad: codigoActividad.value.trim(),
        descripcionActividad: descripcionActividad.value.trim(),
        nrc: nrc.value.trim(),
        nit: nit.value.trim(),
        dui: dui.value.trim(),
        departamento: departamento.value,
        municipio: municipio.value
      };
      if(editIndex === -1){
        clientes.push(obj);
      } else {
        clientes[editIndex] = obj;
      }
      localStorage.setItem('clientes_v1', JSON.stringify(clientes));
      renderTabla(clientes);
      formCard.style.display='none';
    });

    // Abrir para editar
    function abrirParaEditar(i){
      const c = clientes[i]; if(!c) return;
      editIndex = i;
      codigo.value = c.codigo;
      nombre.value = c.nombre;
      telefono.value = c.telefono;
      email.value = c.email;
      codigoActividad.value = c.codigoActividad;
      descripcionActividad.value = c.descripcionActividad;
      nrc.value = c.nrc;
      nit.value = c.nit;
      dui.value = c.dui;
      departamento.value = c.departamento || '';
      // disparar change para poblar municipios
      departamento.dispatchEvent(new Event('change'));
      municipio.value = c.municipio || '';
      formCard.style.display = 'block';
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // Buscar/filtrar
    btnBuscar.addEventListener('click', ()=>{
      const q = filtro.value.trim().toLowerCase();
      if(!q){ renderTabla(clientes); return; }
      const res = clientes.filter(c=>{
        return (c.nombre && c.nombre.toLowerCase().includes(q)) ||
               (c.nrc && c.nrc.toLowerCase().includes(q)) ||
               (c.nit && c.nit.toLowerCase().includes(q)) ||
               (c.dui && c.dui.toLowerCase().includes(q));
      });
      renderTabla(res);
    });

    // Abrir modal actividades
    document.getElementById('btnBuscarActividad').addEventListener('click', ()=>{
      llenarTablaActividades(actividades);
      modalActividades.show();
    });

    function llenarTablaActividades(list){
      const tbody = document.querySelector('#tablaActividades tbody'); tbody.innerHTML = '';
      list.forEach(a=>{
        const tr = document.createElement('tr');
        tr.classList.add('cursor-pointer');
        tr.innerHTML = `<td>${a.codigo}</td><td>${escapeHtml(a.descripcion)}</td>`;
        tr.addEventListener('click', ()=>{
          codigoActividad.value = a.codigo;
          descripcionActividad.value = a.descripcion;
          modalActividades.hide();
        });
        tbody.appendChild(tr);
      });
    }

    // Buscar en modal
    document.getElementById('btnBuscarActModal').addEventListener('click', ()=>{
      const q = document.getElementById('buscarAct').value.trim().toLowerCase();
      const res = actividades.filter(a=> a.codigo.toLowerCase().includes(q) || a.descripcion.toLowerCase().includes(q));
      llenarTablaActividades(res);
    });

    // Inicializar
    init();
  </script>
</body>
</html>
