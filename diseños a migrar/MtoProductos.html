<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mantenimiento de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body{
      padding:20px;
      background:linear-gradient(135deg,#f0f4ff,#e0f7fa);
      font-family: 'Segoe UI', sans-serif;
    }
    h2{
      font-weight:700;
      color:#0d47a1;
      text-shadow:1px 1px 2px rgba(0,0,0,.1);
    }
    .btn-primary{
      background:linear-gradient(135deg,#1976d2,#0d47a1);
      border:none;
    }
    .btn-primary:hover{
      background:linear-gradient(135deg,#1565c0,#0b3c91);
    }
    .card{
      border-radius:1rem;
      box-shadow:0 4px 10px rgba(0,0,0,.1);
    }
    .card-body{
      padding:2rem;
    }
    .table{
      border-radius:10px;
      overflow:hidden;
    }
    .table thead{
      background:#0d47a1;
      color:white;
    }
    .table tbody tr:hover{
      background:#e3f2fd;
    }
    #formCard{
      animation: fadeInDown .5s ease;
    }
    @keyframes fadeInDown{
      from{opacity:0;transform:translateY(-20px);}
      to{opacity:1;transform:translateY(0);}
    }
    .form-check-label{
      margin-left:4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4"><i class="fa-solid fa-boxes-stacked"></i> Mantenimiento de Productos</h2>

    <div class="mb-3 d-flex flex-wrap gap-2">
      <button id="btnNuevo" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nuevo producto</button>

      <div class="input-group flex-grow-1">
        <input id="filtro" type="text" class="form-control" placeholder="🔍 Buscar por nombre o código...">
        <button id="btnBuscar" class="btn btn-outline-primary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
      </div>
    </div>

    <!-- Formulario -->
    <div id="formCard" class="card mb-4" style="display:none">
      <div class="card-body">
        <h5 class="mb-3"><i class="fa-solid fa-pen-to-square"></i> Datos del Producto</h5>
        <form id="productoForm">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Código</label>
              <input id="codigo" class="form-control">
            </div>
            <div class="col-md-5">
              <label class="form-label">Nombre</label>
              <input id="nombre" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo</label>
              <select id="tipo" class="form-select">
                <option value="Bien">Bien</option>
                <option value="Servicio" selected>Servicio</option>
              </select>
            </div>
            
            <div class="col-md-4">
              <label class="form-label">Precio venta</label>
              <input id="precio" type="number" step="0.01" class="form-control" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Presentación</label>
              <input id="presentacion" class="form-control">
            </div>

            <div class="col-md-4">
              <label class="form-label">Costo</label>
              <input id="costo" type="number" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo cobro</label>
              <select id="tipoCobro" class="form-select">
                <option value="Gravado">Gravado</option>
                <option value="Exento">Exento</option>
                <option value="No sujeto">No sujeto</option>
              </select>
            </div>

            <div id="dvServHoraDia">
                
                <div class="col-md-4 d-flex align-items-center">
                    <input class="form-check-input" type="checkbox" id="chkHora">
                    <label class="form-check-label" for="chkHora">¿Servicio por hora o por dia?</label>
                </div>

                <div id="graciaDiv" class="col-md-4" style="display:none">
                    <label class="form-label">Tiempo de gracia por hora(min)</label>
                    <input id="gracia" type="number" class="form-control" min="0" value="0">
                </div>
                
                <div id="precioDiaDiv" class="col-md-4" style="display:none">
                    <label class="form-label">Precio por dia</label>
                    <input id="ventadia" type="number" class="form-control" min="0" value="0">
                </div>

            </div>
            

            <div class="col-12 mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
              <button id="btnCancelar" type="button" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla de productos -->
    <div class="card">
      <div class="card-body">
        <h5 class="mb-3"><i class="fa-solid fa-table"></i> Lista de Productos</h5>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle" id="tablaProductos">
            <thead>
              <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Estado y almacenamiento local
    let productos = JSON.parse(localStorage.getItem('productos_v1')||'[]');
    let editIndex = -1;

    // DOM
    const btnNuevo = document.getElementById('btnNuevo');
    const formCard = document.getElementById('formCard');
    const productoForm = document.getElementById('productoForm');
    const btnCancelar = document.getElementById('btnCancelar');
    const tablaBody = document.querySelector('#tablaProductos tbody');
    const filtro = document.getElementById('filtro');
    const btnBuscar = document.getElementById('btnBuscar');
  const chkHora = document.getElementById('chkHora');
    const graciaDiv = document.getElementById('graciaDiv');
    const precioDiaDiv = document.getElementById('precioDiaDiv');

    // Campos
    const codigo = document.getElementById('codigo');
    const nombre = document.getElementById('nombre');
    const tipo = document.getElementById('tipo');
    const precio = document.getElementById('precio');
    const presentacion = document.getElementById('presentacion');
    const costo = document.getElementById('costo');
    const tipoCobro = document.getElementById('tipoCobro');
    const gracia = document.getElementById('gracia');
    const ventadia = document.getElementById('ventadia');

    // Mostrar/ocultar campo gracia
    chkHora.addEventListener('change', ()=>{
      graciaDiv.style.display = chkHora.checked ? 'block':'none';
      precioDiaDiv.style.display = chkHora.checked ? 'block':'none';
    });



    tipo.addEventListener('change', ()=>{
        
        document.getElementById('dvServHoraDia').hidden = true;
        if(tipo.value == "Servicio")
        {
            document.getElementById('dvServHoraDia').hidden = false;
        }

    });

    // Generar código automático
    function generarCodigo(){
      const last = productos.length? productos[productos.length-1].codigo : null;
      if(!last) return 'P0001';
      const num = parseInt(last.replace(/\D/g,'')) + 1;
      return 'P' + String(num).padStart(4,'0');
    }

    // Render tabla
    function renderTabla(list){
      tablaBody.innerHTML = '';
      list.forEach((p, idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.codigo}</td>
          <td>${p.nombre}</td>
          <td>${p.precio}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-primary" onclick="abrirParaEditar(${idx})"><i class="fa-solid fa-pen"></i></button>
          </td>`;
        tablaBody.appendChild(tr);
      });
    }

    // Abrir formulario nuevo
    btnNuevo.addEventListener('click', ()=>{
      editIndex=-1;
      productoForm.reset();
      codigo.value = generarCodigo();
      graciaDiv.style.display='none';
      formCard.style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    });

    // Cancelar
    btnCancelar.addEventListener('click', ()=>{ formCard.style.display='none'; });

    // Guardar
    productoForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const obj = {
        codigo: codigo.value || generarCodigo(),
        nombre: nombre.value.trim(),
        tipo: tipo.value,
        gracia: parseInt(gracia.value||0),
        precio: parseFloat(precio.value||0),
        presentacion: presentacion.value.trim(),
        costo: parseFloat(costo.value||0),
        tipoCobro: tipoCobro.value,
        cant: 0,
        shoradia: chkHora.checked,
    mode: chkHora.checked ? "hourly" : "-",
        preciodia: parseInt(ventadia.value||0)
      };
      if(editIndex===-1){
        productos.push(obj);
      } else {
        productos[editIndex]=obj;
      }
      localStorage.setItem('productos_v1', JSON.stringify(productos));
      renderTabla(productos);
      formCard.style.display='none';
    });

    // Editar
    window.abrirParaEditar = function(i){
      const p = productos[i]; if(!p) return;
      editIndex = i;
      codigo.value = p.codigo;
      nombre.value = p.nombre;
      tipo.value = p.tipo;

      // Restaurar checkbox y campos relacionados a servicio hora/día
      chkHora.checked = !!p.shoradia;
      onchangechkhora();

      gracia.value = p.gracia || 0;
      precio.value = p.precio;
      presentacion.value = p.presentacion;
      costo.value = p.costo;
      tipoCobro.value = p.tipoCobro;

      // El input de precio por día (id=ventadia) almacena la propiedad 'preciodia'
      ventadia.value = (p.preciodia !== undefined) ? p.preciodia : 0;

      formCard.style.display = 'block';
      window.scrollTo({top:0,behavior:'smooth'});
    };

    function onchangechkhora()
    {
      graciaDiv.style.display = chkHora.checked ? 'block':'none';
      precioDiaDiv.style.display = chkHora.checked ? 'block':'none';
    }

    
    // Buscar
    btnBuscar.addEventListener('click', ()=>{
      const q=filtro.value.trim().toLowerCase();
      if(!q){renderTabla(productos);return;}
      const res=productos.filter(p=>
        p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q));
      renderTabla(res);
    });

    // Inicializar
    renderTabla(productos);
  </script>
</body>
</html>
