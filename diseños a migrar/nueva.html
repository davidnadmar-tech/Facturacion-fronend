<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva Factura (Normal)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{padding:20px;background:#f7f9fc;font-family: 'Segoe UI', sans-serif}
    .card{border-radius:12px}
  </style>
</head>
<body>
  <div class="container">
    <h3 class="mb-3">Nueva Factura (Formulario)</h3>
    <div class="card p-3">
      <form id="facturaForm">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Cliente</label>
            <input id="cliente" class="form-control" required title="Nombre del cliente" placeholder="Nombre del cliente">
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha</label>
            <input id="fecha" type="date" class="form-control" required title="Fecha de la factura">
          </div>
          <div class="col-md-4">
            <label class="form-label">Tipo Pago</label>
            <select id="tipoPago" class="form-select" title="Tipo de pago">
              <option>Contado</option>
              <option>Crédito</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Detalle (texto simple)</label>
            <textarea id="detalle" class="form-control" rows="4" title="Detalle de la factura" placeholder="Descripción o lista de items"></textarea>
          </div>

          <div class="col-md-4">
            <label class="form-label">Total</label>
            <input id="total" type="number" step="0.01" class="form-control" required title="Total a pagar" placeholder="0.00">
          </div>

          <div class="col-12 mt-3">
            <button class="btn btn-primary" type="submit">Guardar Factura</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
    const form = document.getElementById('facturaForm');
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const facturas = JSON.parse(localStorage.getItem('FACTURAS')||'[]');
      const obj = {
        cliente: document.getElementById('cliente').value,
        fecha: document.getElementById('fecha').value,
        tipoPago: document.getElementById('tipoPago').value,
        detalle: (document.getElementById('detalle').value||'').split('\n'),
        total: parseFloat(document.getElementById('total').value||0),
        tipoFactura: '1',
        numeroComprobante: (facturas.length+1)
      };
      facturas.push(obj);
      localStorage.setItem('FACTURAS', JSON.stringify(facturas));
      alert('Factura guardada');
      // Opcional: redirigir a consulta
      window.location.href = 'consultafacturas.html';
    });
  </script>
</body>
</html>
